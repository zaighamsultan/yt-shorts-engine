name: Process Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct URL to the video file (e.g. an uploaded video link)"
        required: true
      brand_text:
        description: "Optional watermark text (leave blank for none)"
        required: false
  repository_dispatch:
    types: [process-video]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run processing script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEM_API_KEY: ${{ secrets.GEM_API_KEY }}
          VIDEO_URL: ${{ github.event.inputs.video_url || github.event.client_payload.video_url }}
          BRAND_TEXT: ${{ github.event.inputs.brand_text || github.event.client_payload.brand_text }}
        run: python process_video.py --video "$VIDEO_URL" --output-dir output --brand-text "$BRAND_TEXT"

      - name: Upload clips as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: output/
