name: Process Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct URL to the video file (e.g. an uploaded video link)"
        required: true
      brand_text:
        description: "Optional watermark text (leave blank for none)"
        required: false
      caption_only:
        description: "Optional: language for caption-only mode (e.g. 'en', 'urdu'). Leave blank for normal multi-clip mode."
        required: false
  repository_dispatch:
    types: [process-video]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube cookies file (if provided)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
          fi

      - name: Run processing script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEM_API_KEY: ${{ secrets.GEM_API_KEY }}
          VIDEO_URL: ${{ github.event.inputs.video_url || github.event.client_payload.video_url }}
          BRAND_TEXT: ${{ github.event.inputs.brand_text || github.event.client_payload.brand_text }}
          CAPTION_ONLY: ${{ github.event.inputs.caption_only || github.event.client_payload.caption_only }}
        run: |
          if [ -n "$CAPTION_ONLY" ]; then
            python process_video.py --video "$VIDEO_URL" --output-dir output --brand-text "$BRAND_TEXT" --caption-only "$CAPTION_ONLY"
          else
            python process_video.py --video "$VIDEO_URL" --output-dir output --brand-text "$BRAND_TEXT"
          fi

      - name: Upload clips as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: output/
