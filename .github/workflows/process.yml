name: Process Video
run-name: yts-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct link to the video file"
        required: true
      brand_text:
        description: "Optional watermark text"
        required: false
        default: ""
      request_id:
        description: "Internal ID used by the WordPress plugin to find this run"
        required: false
        default: ""
      caption_only:
        description: "Leave empty to cut clips. Or a language code (en, ur, hi, ar...) to caption the whole video"
        required: false
        default: ""
      clip_language:
        description: "Optional caption language for short clips (ur, hi, ar...). Empty = English"
        required: false
        default: ""
      caption_colors:
        description: "Optional highlight colors as comma-separated hex, e.g. FFEB3B,00E5FF"
        required: false
        default: ""
      important_size:
        description: "Optional text size of important words (40-140)"
        required: false
        default: ""
      common_size:
        description: "Optional text size of common words (40-140)"
        required: false
        default: ""
      caption_style:
        description: "Caption look: empty/classic = bottom captions, behind = big captions behind the person"
        required: false
        default: ""
      rows_config:
        description: "Optional JSON with the 2 to 5 caption rows for the behind look (set by the WordPress plugin)"
        required: false
        default: ""

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Getting things ready
        uses: actions/checkout@v4

      - name: Setting up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installing video tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-noto-core libgl1
          pip install -r requirements.txt

      - name: Waiting for your turn
        run: sleep $((RANDOM % 20))

      - name: Creating your video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEM_API_KEY: ${{ secrets.GEM_API_KEY }}
          VIDEO_URL: ${{ inputs.video_url }}
          BRAND_TEXT: ${{ inputs.brand_text }}
          CAPTION_ONLY: ${{ inputs.caption_only }}
          CLIP_LANGUAGE: ${{ inputs.clip_language }}
          CAPTION_COLORS: ${{ inputs.caption_colors }}
          IMPORTANT_SIZE: ${{ inputs.important_size }}
          COMMON_SIZE: ${{ inputs.common_size }}
          CAPTION_STYLE: ${{ inputs.caption_style }}
          ROWS_CONFIG: ${{ inputs.rows_config }}
        run: |
          args=(--video "$VIDEO_URL")
          if [ -n "$BRAND_TEXT" ]; then
            args+=(--brand-text "$BRAND_TEXT")
          fi
          if [ -n "$CAPTION_ONLY" ]; then
            args+=(--caption-only "$CAPTION_ONLY")
          fi
          if [ -n "$CLIP_LANGUAGE" ]; then
            args+=(--clip-language "$CLIP_LANGUAGE")
          fi
          if [ -n "$CAPTION_COLORS" ]; then
            args+=(--caption-colors "$CAPTION_COLORS")
          fi
          if [ -n "$IMPORTANT_SIZE" ]; then
            args+=(--important-size "$IMPORTANT_SIZE")
          fi
          if [ -n "$COMMON_SIZE" ]; then
            args+=(--common-size "$COMMON_SIZE")
          fi
          if [ -n "$CAPTION_STYLE" ]; then
            args+=(--caption-style "$CAPTION_STYLE")
          fi
          if [ -n "$ROWS_CONFIG" ]; then
            args+=(--rows-config "$ROWS_CONFIG")
          fi
          python process_video.py "${args[@]}"

      - name: Packing your files
        run: |
          rm -f output/project_*/source.mp4 output/project_*/audio.mp3

      - name: Uploading result
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: output
          retention-days: 1
